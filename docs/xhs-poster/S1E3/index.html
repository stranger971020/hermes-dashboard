<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Noto Sans SC', -apple-system, 'Helvetica Neue', sans-serif;
    background: #f5f2ed;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px 20px;
  }

  .poster {
    width: 680px;
    max-height: 780px;
    background: #fffef9;
    border-radius: 20px;
    box-shadow: 0 3px 24px rgba(0,0,0,0.06);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .top-bar { height: 8px; background: linear-gradient(to right, #e8c547, #f4a261); flex-shrink: 0; }

  .content {
    padding: 24px 32px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1;
    min-height: 0;
  }

  .series-tag {
    display: inline-block;
    background: linear-gradient(135deg, #e8c547, #f4a261);
    color: #fff;
    font-size: 12px; font-weight: 500; padding: 5px 14px; border-radius: 18px; letter-spacing: 0.5px; margin-bottom: 16px; flex-shrink: 0;
  }

  .title { font-size: 36px; font-weight: 900; color: #1a1a1a; line-height: 1.25; margin-bottom: 4px; text-align: center; letter-spacing: -0.5px; flex-shrink: 0; }
  .title-line { display: block; width: 100%; }

  .quote { font-size: 20px; font-weight: 400; color: #5a5a5a; margin: 16px 0 18px; text-align: center; line-height: 1.55; flex-shrink: 0; }
  .quote strong { color: #3a3a3a; font-weight: 700; }

  .divider { width: 100%; height: 1px; background: linear-gradient(to right, transparent, #e8c547, transparent); margin: 12px 0; flex-shrink: 0; }

  .core-conflict { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 14px 0; font-size: 22px; color: #3a3a3a; text-align: center; flex-shrink: 0; }
  .core-conflict .item { padding: 12px 22px; background: #fefcf5; border: 1.5px solid #ede6d4; border-radius: 10px; min-width: 160px; flex-shrink: 0; }
  .core-conflict .item.green { background: #fafff8; border-color: #e8c547; color: #3a3a3a; }
  .core-conflict .arrow { font-size: 26px; color: #999; flex-shrink: 0; line-height: 1.4; }

  .golden-line { background: linear-gradient(90deg, rgba(232,197,71,0.15), transparent); padding: 16px 22px; border-left: 4px solid #e8c547; margin-top: 16px; font-size: 18px; line-height: 1.65; color: #3a3a3a; text-align: left; width: 100%; border-radius: 0 10px 10px 0; flex-shrink: 0; }
  .golden-line strong { color: #1a1a1a; font-weight: 700; }

  .bottom-section { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 14px; border-top: 1px solid #ede6d4; width: 100%; flex-shrink: 0; }
  .fan-chai { display: flex; align-items: center; gap: 5px; }
  .stars { font-size: 20px; letter-spacing: 3px; }

</style>
</head>
<body>
<div class="poster">
  <div class="top-bar"></div>
  <div class="content">
    <div class="series-tag">S1E3 · AI 算得没错——是我们默认了它懂</div>
    <h1 class="title"><span class="title-line" style="font-size:1em;">搞定了</span><br><span class="title-line" style="font-size:0.8em;color:#999;font-weight:400;">=</span><span class="title-line" style="font-size:1em;">做对了？</span></h1>
    <p class="quote"><strong>"已完成汇总，数据一致性良好。"</strong><br>听上去多靠谱啊！<br>但事实是——<br><strong>一致，是因为错得很一致。</strong></p>
    <div class="divider"></div>
    <div class="core-conflict">
      <span class="item green">✅ 数据一致性良好</span>
      <span class="arrow"><br>≠<br></span>
      <span class="item" style="color:#c0813d;">📦 存量 ≠ 流量</span>
    </div>
    <div class="golden-line">它算得一点没错——<strong>错的是我们</strong><br>默认了 AI 懂"存量"和"流量"的区别。<br>它不懂，除非你把它定义清楚。</div>
    <div class="bottom-section">
      <div class="fan-chai"><span class="stars">★★★★</span><span style="font-size:13px;color:#aaa;">翻车指数</span></div>
    </div>
  </div>
</div>
</body></html>
