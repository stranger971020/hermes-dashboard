<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', -apple-system, 'Helvetica Neue', sans-serif;
    background: #f5f2ed;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 40px 20px;
  }

  .poster {
    width: 680px;
    background: #fffef9;
    border-radius: 24px;
    box-shadow: 0 4px 32px rgba(0,0,0,0.06);
    overflow: hidden;
    position: relative;
  }

  .top-bar {
    height: 8px;
    background: linear-gradient(to right, #e8c547, #f4a261);
  }

  .content {
    padding: 48px 40px 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 系列角标 */
  .series-tag {
    display: inline-block;
    background: linear-gradient(135deg, #e8c547, #f4a261);
    color: #fff;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 16px;
    border-radius: 20px;
    letter-spacing: 0.5px;
    margin-bottom: 32px;
  }

  /* 大标题 */
  .title {
    font-size: 48px;
    font-weight: 900;
    color: #1a1a1a;
    line-height: 1.35;
    margin-bottom: 6px;
    text-align: center;
    letter-spacing: -0.5px;
  }

  .title-line {
    display: block;
    width: 100%;
  }

  /* 引言区 */
  .quote {
    font-size: 26px;
    font-weight: 400;
    color: #5a5a5a;
    margin: 32px 0 28px;
    text-align: center;
    line-height: 1.6;
  }

  .quote strong {
    color: #3a3a3a;
    font-weight: 700;
  }

  /* 分隔线 */
  .divider {
    width: 100%;
    height: 1px;
    background: linear-gradient(to right, transparent, #e8c547, transparent);
    margin: 20px 0;
  }

  /* 核心对比 */
  .core-conflict {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin: 18px 0;
    font-size: 24px;
    color: #3a3a3a;
    line-height: 1.5;
    text-align: center;
  }

  .core-conflict .item {
    padding: 16px 28px;
    background: #fefcf5;
    border: 1.5px solid #ede6d4;
    border-radius: 12px;
    min-width: 180px;
  }

  .core-conflict .item.green {
    background: #fafff8;
    border-color: #e8c547;
    color: #3a3a3a;
  }

  .core-conflict .arrow {
    font-size: 28px;
    color: #999;
  }

  /* 金句卡 */
  .golden-line {
    background: linear-gradient(90deg, rgba(232,197,71,0.15), transparent);
    padding: 20px 28px;
    border-left: 4px solid #e8c547;
    margin-top: 28px;
    font-size: 21px;
    line-height: 1.75;
    color: #3a3a3a;
    text-align: left;
    width: 100%;
    border-radius: 0 12px 12px 0;
  }

  .golden-line strong {
    color: #1a1a1a;
    font-weight: 700;
  }

  /* 底部区 */
  .bottom-section {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 32px;
    width: 100%;
  }

  .fan-chai {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .stars {
    font-size: 22px;
    letter-spacing: 3px;
  }

  .label-small {
    font-size: 14px;
    color: #999;
    margin-top: 6px;
  }

</style>
</head>
<body>

<div class="poster">
  <div class="top-bar"></div>

  <div class="content">

    <!-- 系列角标 -->
    <div class="series-tag">S1E3 · AI 算得没错——是我们默认了它懂</div>

    <!-- 大标题 -->
    <h1 class="title">
      <span class="title-line">搞定了</span>
      <span class="title-line" style="font-size:0.85em;color:#999;">=</span>
      <span class="title-line">做对了？</span>
    </h1>

    <!-- 引言 -->
    <p class="quote">
      <strong>"已完成汇总，数据一致性良好。"</strong><br>听上去多靠谱啊！<br>但事实是——<br><strong>一致，是因为错得很一致。</strong>
    </p>

    <div class="divider"></div>

    <!-- 核心对比 -->
    <div class="core-conflict">
      <span class="item green">✅ 数据一致性良好</span>
      <span class="arrow"><br>≠<br></span>
      <span class="item" style="color:#c0813d;">📦 存量 ≠ 流量</span>
    </div>

    <!-- 金句 -->
    <div class="golden-line">
      它算得一点没错——<strong>错的是我们</strong><br>默认了 AI 懂"存量"和"流量"的区别。<br>它不懂，除非你把它定义清楚。
    </div>

    <!-- 底部 -->
    <div class="bottom-section">
      <div>
        <div class="fan-chai">
          <span class="stars">★★★★</span><span style="font-size:14px;color:#aaa;">翻车指数</span>
        </div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
